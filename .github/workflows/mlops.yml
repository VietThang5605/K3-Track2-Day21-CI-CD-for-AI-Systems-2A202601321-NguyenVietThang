name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - 'tests/**.py'
      - '.github/workflows/**'
  workflow_dispatch:


jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chạy unit tests trên dữ liệu ảo (không cần kết nối cloud storage).
  # Nếu có bất kỳ test nào thất bại, pipeline dừng lại ở đây và không tiến hành
  # huấn luyện hay triển khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest


      - name: Run unit tests
        # 1. Chạy pytest trên thư mục tests/ với cờ -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xác thực AWS S3, pull dữ liệu bằng DVC, huấn luyện mô hình, upload artifact.
  # Chỉ chạy khi Job 1 (Unit Test) hoàn thành thành công.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt


      - name: Authenticate to Cloud Storage (AWS)
        env:
          CREDS: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          python - <<'EOF'
          import os, json, ast, re, base64

          raw = os.environ.get("CREDS", "").strip()
          key_id, secret_key, region = "", "", "ap-southeast-1"

          # 0. Giải mã nếu là Base64
          try:
              decoded = base64.b64decode(raw).decode("utf-8")
              if "AKIA" in decoded:
                  raw = decoded
          except Exception:
              pass

          # 1. Thử parse dạng JSON / Python Dict
          try:
              data = json.loads(raw)
              if isinstance(data, dict):
                  dl = {k.lower(): str(v).strip() for k, v in data.items()}
                  key_id = dl.get("aws_access_key_id") or dl.get("access_key_id") or dl.get("access_key") or ""
                  secret_key = dl.get("aws_secret_access_key") or dl.get("secret_access_key") or dl.get("secret_key") or dl.get("secret") or ""
                  region = dl.get("aws_region") or dl.get("region") or "ap-southeast-1"
          except Exception:
              try:
                  data = ast.literal_eval(raw)
                  if isinstance(data, dict):
                      dl = {k.lower(): str(v).strip() for k, v in data.items()}
                      key_id = dl.get("aws_access_key_id") or dl.get("access_key_id") or dl.get("access_key") or ""
                      secret_key = dl.get("aws_secret_access_key") or dl.get("secret_access_key") or dl.get("secret_key") or dl.get("secret") or ""
                      region = dl.get("aws_region") or dl.get("region") or "ap-southeast-1"
              except Exception:
                  pass

          # 2. Thử parse dạng INI / Key=Value / Key:Value theo từng dòng
          if not key_id or not secret_key:
              for line in raw.splitlines():
                  line = line.strip()
                  if "=" in line or ":" in line:
                      sep = "=" if "=" in line else ":"
                      k, v = line.split(sep, 1)
                      kl = k.strip().lower()
                      val = v.strip().strip("'\"")
                      if "secret" in kl:
                          secret_key = val
                      elif "access" in kl or "key" in kl:
                          key_id = val
                      elif "region" in kl:
                          region = val

          # 3. Trích xuất trực tiếp bằng Pattern chuẩn của AWS (AKIA 20 ký tự & Secret 40 ký tự)
          if not key_id:
              m_key = re.search(r'(AKIA[0-9A-Z]{16})', raw)
              if m_key:
                  key_id = m_key.group(1)
          
          if not secret_key:
              raw_clean = raw.replace(key_id, "") if key_id else raw
              m_sec = re.search(r'([A-Za-z0-9/+=]{40})', raw_clean)
              if m_sec:
                  secret_key = m_sec.group(1)

          if not key_id or not secret_key:
              raise SystemExit(f"ERROR: Khong the trich xuat AWS credentials. Key tim thay: {bool(key_id)}, Secret tim thay: {bool(secret_key)}. Do dai chuoi: {len(raw)}")

          # 1. Ghi vào biến môi trường GitHub Actions
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={key_id}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={secret_key}\n")
              f.write(f"AWS_REGION={region}\n")
              f.write(f"AWS_DEFAULT_REGION={region}\n")
              f.write("AWS_EC2_METADATA_DISABLED=true\n")

          # 2. Tạo file cấu hình ~/.aws/credentials và ~/.aws/config cho DVC/s3fs
          aws_dir = os.path.expanduser("~/.aws")
          os.makedirs(aws_dir, exist_ok=True)
          with open(os.path.join(aws_dir, "credentials"), "w") as f:
              f.write(f"[default]\naws_access_key_id = {key_id}\naws_secret_access_key = {secret_key}\n")
          with open(os.path.join(aws_dir, "config"), "w") as f:
              f.write(f"[default]\nregion = {region}\n")
          
          masked_key = key_id[:4] + "..." + key_id[-4:] if len(key_id) >= 8 else "***"
          print(f"AWS credentials configured successfully. Access Key: {masked_key}, Region: {region}")
          EOF




      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://${{ secrets.CLOUD_BUCKET }}/dvc/

      - name: Pull data with DVC
        # 3. Cấu hình DVC remote credentials và pull dữ liệu từ AWS S3
        run: |
          dvc remote modify myremote access_key_id "$AWS_ACCESS_KEY_ID" --local
          dvc remote modify myremote secret_access_key "$AWS_SECRET_ACCESS_KEY" --local
          dvc remote modify myremote region "$AWS_REGION" --local
          dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc -v




      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py


      - name: Read metrics
        id: read_metrics
        # 4. Đọc giá trị accuracy từ outputs/metrics.json và set thành output của job
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "Model Accuracy: $ACC"

      - name: Upload model to Cloud Storage (AWS S3)
        # 5. Sử dụng boto3 SDK để upload models/model.pkl lên S3
        env:
          BUCKET_NAME: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          import boto3

          bucket_name = os.environ.get("BUCKET_NAME", "")
          s3_key = "models/latest/model.pkl"
          local_file = "models/model.pkl"

          s3 = boto3.client("s3")
          print(f"Uploading {local_file} to s3://{bucket_name}/{s3_key}...")
          s3.upload_file(local_file, bucket_name, s3_key)
          print("Model uploaded successfully to AWS S3!")
          EOF


      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiểm tra ngưỡng chất lượng (accuracy >= 0.70).
  # Pipeline dừng lại ở đây nếu mô hình chưa đạt yêu cầu.
  # Chỉ chạy khi Job 2 (Train) hoàn thành thành công.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        # 6. Đọc accuracy từ output của job train và kiểm tra ngưỡng >= 0.70
        run: |
          python - <<'EOF'
          import sys

          accuracy = float("${{ needs.train.outputs.accuracy }}")
          threshold = 0.70

          print(f"Model Accuracy: {accuracy:.4f} | Required Threshold: {threshold}")
          if accuracy >= threshold:
              print("PASSED: Accuracy meets threshold. Proceeding to deploy.")
          else:
              print(f"FAILED: Accuracy {accuracy:.4f} < {threshold}. Deployment aborted.")
              sys.exit(1)
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Triển khai lên VM qua SSH.
  # Chỉ chạy khi Job 3 (Eval) hoàn thành thành công.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # 7. Restart service mlops-serve trên EC2
            echo "Restarting mlops-serve service on EC2..."
            sudo systemctl restart mlops-serve
            sleep 5
            
            # 8. Chờ server sẵn sàng rồi gọi curl /health để xác nhận
            echo "Checking service health status..."
            if curl -sf http://localhost:8000/health; then
                echo "Deployment succeeded! Server health check passed."
            else
                echo "Deployment failed! Health check did not return ok."
                sudo systemctl status mlops-serve
                exit 1
            fi

